<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الرياضيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=STIX+Two+Text:ital,wght@0,500;0,700;1,500&display=swap">
<style>
/* تخطيط: خريطة جزر عائمة (شبكة من عمودين، وعمود واحد على الجوال) ثم بطاقات تعليمية مركزية */
:root {
  --bg: #fff8f5;
  --bg-2: #fdeef0;
  --card: #fffdfb;
  --ink: #3a1230;
  --ink-2: #6c4a62;
  --plum: #6b1038;
  --pink: #d12f6b;
  --pink-2: #ef7ca5;
  --pink-soft: #ffe3ec;
  --gold: #e9a914;
  --gold-soft: #fff0c2;
  --line: #ecdbe2;
  --ok: #17734c;
  --ok-soft: #dff5ea;
  --no: #b3261e;
  --no-soft: #fde6e3;
  --info-soft: #efe9fb;
  --shadow: 0 10px 30px rgba(107, 16, 56, .12);
  --shadow-s: 0 4px 12px rgba(107, 16, 56, .10);
  --r: 20px;
  --f-display: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  --f-body: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  --f-math: 'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
  color-scheme: light;
}
[data-w="pink"]  { --c1: #ec6c9c; --c2: #c93f7a; --c3: #ffd1e0; --cs: #ffe9f0; --cd: #9d2458; }
[data-w="teal"]  { --c1: #4cc3ce; --c2: #2a97a7; --c3: #c6f0f3; --cs: #e2f8fa; --cd: #17707e; }
[data-w="lilac"] { --c1: #b49be6; --c2: #8a6bc8; --c3: #e8defb; --cs: #f0eafc; --cd: #5f43a3; }
[data-w="amber"] { --c1: #f6cb5c; --c2: #e0a223; --c3: #fff0bd; --cs: #fff6d9; --cd: #8e6307; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(1200px 500px at 85% -10%, #ffe9f1 0, transparent 60%), radial-gradient(900px 500px at 0% 100%, #fdf1da 0, transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font: 500 18px/1.75 var(--f-body);
  direction: rtl;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
#app { min-height: 100vh; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; max-width: 1180px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1.3; margin: 0; color: var(--plum); text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid #2f6bff; outline-offset: 3px; border-radius: 8px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { display: inline-flex; width: 1.25em; height: 1.25em; vertical-align: -0.2em; flex: none; }
.ic svg { width: 100%; height: 100%; display: block; }
.ic.gold { color: var(--gold); }
.flip svg { transform: scaleX(-1); }

/* رياضيات */
.m { font-family: var(--f-math); font-size: 1.18em; font-weight: 500; unicode-bidi: isolate; white-space: nowrap; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 .15em; }
.frac .n { border-bottom: 1.5px solid currentColor; padding: 0 .2em .05em; }
.frac .d { padding: .05em .2em 0; }
.rad { display: inline-flex; align-items: flex-start; }
.rad .rb { border-top: 1.5px solid currentColor; padding: 0 .15em; margin-top: .1em; }
sup, sub { line-height: 0; }

/* أزرار */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 48px; padding: 10px 22px; border-radius: 999px; border: 2px solid transparent; font-weight: 600; font-size: 1rem; transition: transform .15s, box-shadow .15s, background .15s; text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: linear-gradient(180deg, #e8467f, var(--pink)); color: #fff; box-shadow: 0 6px 0 #9f1d4f, 0 12px 20px rgba(209, 47, 107, .28); border-color: #ffd3e1; }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); }
.btn-primary:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #9f1d4f; }
.btn-xl { font-family: var(--f-display); font-size: 1.25rem; padding: 12px 34px; min-height: 56px; }
.btn-ghost { background: #fff; border-color: #e7c6d3; color: var(--plum); }
.btn-ghost:hover { background: var(--pink-soft); }
.btn-quiet { background: transparent; color: var(--ink-2); text-decoration: underline; text-underline-offset: 4px; }
.btn-danger { background: var(--no); color: #fff; }
.icon-btn { display: inline-flex; align-items: center; gap: .4em; min-height: 44px; min-width: 44px; padding: 6px 12px; border-radius: 999px; border: 2px solid #e7c6d3; background: #fff; color: var(--plum); font-weight: 600; font-size: .9rem; justify-content: center; }
.icon-btn:hover { background: var(--pink-soft); }
.pill { display: inline-flex; align-items: center; gap: .45em; padding: 5px 18px; border-radius: 999px; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; border: 2px solid transparent; }
.pill-pink { background: linear-gradient(180deg, #ee5b90, #d12f6b); color: #fff; border-color: #ffd5e3; }
.pill-gold { background: #fff; color: var(--plum); border-color: #e8c668; }
.pill-w { background: var(--cs); color: var(--cd); border-color: var(--c1); }
.kicker { font-weight: 600; color: var(--pink); font-size: 1rem; }

/* الشريط العلوي */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px max(16px, calc(50vw - 590px)); margin-inline: calc(50% - 50vw); background: rgba(255, 248, 245, .92); backdrop-filter: blur(6px); }
.tb-end { justify-self: end; display: flex; }
.counters { display: flex; gap: 8px; flex-wrap: nowrap; }
.counter { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid #efd9a2; box-shadow: var(--shadow-s); font-size: .92rem; white-space: nowrap; }
.counter b { font-family: var(--f-math); font-size: 1.1em; }
.counter .cl { color: var(--ink-2); }
.counter .ic { color: var(--plum); } .counter .ic.gold { color: var(--gold); }
@media (max-width: 560px) {
  .topbar { grid-template-columns: auto 1fr auto; }
  .lbl { display: none; }
  .counter { padding: 5px 9px; font-size: .82rem; gap: 4px; }
  .counter .cl { display: none; }
  .counters { justify-self: center; }
}

/* شاشة البداية */
.start { position: relative; min-height: 100vh; display: grid; place-items: center; padding-block: 28px; }
.start-art { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.mini { position: absolute; width: min(34vw, 320px); opacity: .95; animation: bob 7s ease-in-out infinite; }
.mini .island-svg { position: static; width: 100%; height: auto; aspect-ratio: 400 / 330; display: block; }
.mini-0 { top: 4%; right: 2%; } .mini-1 { top: 6%; left: 2%; animation-delay: -2s; } .mini-2 { bottom: 4%; right: 3%; animation-delay: -4s; } .mini-3 { bottom: 5%; left: 2%; animation-delay: -1s; }
.start-card { position: relative; z-index: 2; text-align: center; background: rgba(255, 253, 251, .94); border: 2px solid #f3d3df; border-radius: 32px; padding: clamp(24px, 5vw, 48px) clamp(20px, 5vw, 56px); max-width: 640px; box-shadow: var(--shadow); display: grid; gap: 16px; justify-items: center; }
.start-card h1 { font-size: clamp(2.8rem, 9vw, 4.6rem); color: var(--plum); line-height: 1.15; }
.start-card .kicker { background: #fff; border: 2px solid #e8c668; border-radius: 999px; padding: 3px 22px; color: var(--plum); font-family: var(--f-display); font-size: 1.2rem; }
.lead { color: var(--ink-2); max-width: 46ch; }
.start-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
@media (max-width: 720px) { .mini { width: 52vw; opacity: .55; } .mini-0 { top: 1%; right: -10%; } .mini-1 { top: 9%; left: -14%; } .mini-2 { bottom: 1%; right: -14%; } .mini-3 { bottom: 9%; left: -10%; } }

/* الخريطة */
.map { display: grid; gap: 18px; }
.map-head { display: grid; justify-items: center; gap: 8px; text-align: center; padding-top: 6px; }
.map-head h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); }
.islands { position: relative; display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(8px, 3vw, 40px) clamp(8px, 4vw, 56px); padding: 8px 0; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.trail path { stroke: #b0457a; stroke-width: 3; stroke-dasharray: 2 11; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .55; }
.island { position: relative; z-index: 1; display: grid; place-items: center; }
.float { position: relative; width: 100%; max-width: 520px; aspect-ratio: 400 / 330; animation: bob 6s ease-in-out infinite; animation-delay: var(--fd, 0s); filter: drop-shadow(0 14px 18px rgba(107, 16, 56, .14)); }
.island-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wbadge { position: absolute; top: 4%; inset-inline-start: 4%; width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 3px solid var(--c1); color: var(--cd); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; box-shadow: var(--shadow-s); }
.wbadge svg { width: 22px; height: 22px; }
.wname { position: absolute; top: 49%; left: 50%; transform: translateX(-50%); width: max-content; max-width: 88%; text-align: center; background: linear-gradient(180deg, #fffdf6, #fff3d6); border: 2.5px solid #e4b85a; border-radius: 999px; padding: 2px 20px; font-size: clamp(1rem, 2.5vw, 1.35rem); color: var(--plum); box-shadow: var(--shadow-s); }
.nodes { position: absolute; left: 12%; right: 12%; top: 66%; display: flex; justify-content: space-between; align-items: flex-start; }
.node-wrap { display: grid; justify-items: center; gap: 2px; }
.node { position: relative; width: clamp(40px, 8.2vw, 54px); height: clamp(40px, 8.2vw, 54px); border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; background: #fff7e6; color: var(--cd); font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; box-shadow: 0 4px 0 rgba(107, 16, 56, .18), 0 6px 12px rgba(107, 16, 56, .16); transition: transform .15s; }
.node svg { width: 55%; height: 55%; }
.node.locked { background: #efe6ea; color: #8b7a85; }
.node.done { background: var(--gold-soft); color: #c78a00; border-color: #ffe39a; }
.node.open { background: #fff; }
.node:hover:not(.locked), .node:focus-visible { transform: translateY(-3px) scale(1.06); }
.node.current { animation: glow 2s ease-in-out infinite; border-color: #ffe39a; }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2.5px dashed #ffc633; }
.mstars { display: flex; gap: 1px; height: 12px; }
.mstars i { width: 11px; height: 11px; color: #d9c6a8; display: block; } .mstars i.on { color: #f0a81c; }
.mstars svg { width: 100%; height: 100%; display: block; }
.map-actions { display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; padding-top: 10px; }
@media (max-width: 760px) {
  .islands { grid-template-columns: 1fr; gap: 14px; }
  .trail { display: none; }
  .float { max-width: 460px; margin-inline: auto; }
  .wname { font-size: 1.05rem; }
}
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes glow { 0%, 100% { box-shadow: 0 4px 0 rgba(107, 16, 56, .18), 0 0 0 0 rgba(255, 198, 51, .65); } 50% { box-shadow: 0 4px 0 rgba(107, 16, 56, .18), 0 0 0 12px rgba(255, 198, 51, 0); } }

/* بوابة الانتقال */
.iris { position: fixed; z-index: 200; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle, #fff6d8 0, #ffd1e0 45%, #ef7ca5 100%); transform: scale(0); transition: transform .38s ease-in, opacity .4s; pointer-events: none; }
.iris.go { transform: scale(90); } .iris.out { opacity: 0; transition: opacity .4s; }

/* بطاقات */
.card { background: var(--card); border: 2px solid #f1dbe3; border-radius: var(--r); padding: clamp(18px, 3vw, 30px); box-shadow: var(--shadow); }
.intro, .quiz, .result, .achieve, .final { max-width: 820px; margin: 0 auto; display: grid; gap: 18px; padding-top: 6px; }
.stage-head { display: grid; gap: 8px; justify-items: start; }
.stage-head h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); }
.steps-dots { list-style: none; display: flex; gap: 8px; padding: 0; margin: 4px 0 0; flex-wrap: wrap; }
.steps-dots li { padding: 2px 14px; border-radius: 999px; border: 2px solid var(--line); color: var(--ink-2); font-size: .9rem; background: #fff; }
.steps-dots li.cur { background: var(--cd); color: #fff; border-color: var(--cd); font-weight: 600; }
.steps-dots li.past { background: var(--cs); color: var(--cd); border-color: var(--c1); }
.card h2 { font-size: 1.4rem; margin-bottom: 10px; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.points li { position: relative; padding-inline-start: 26px; }
.points li::before { content: ""; position: absolute; inset-inline-start: 2px; top: .62em; width: 11px; height: 11px; border-radius: 3px; transform: rotate(45deg); background: var(--c1, var(--pink-2)); }
.rule { margin-top: 16px; background: var(--gold-soft); border: 2px solid #efd27a; border-radius: 16px; padding: 12px 16px; display: grid; gap: 4px; }
.rule-t { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: #7a5604; font-family: var(--f-display); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.actions.center { justify-content: center; }
.example .ex-q { font-weight: 500; margin-bottom: 8px; }
.ex-steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.ex-steps li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.sn { width: 30px; height: 30px; border-radius: 50%; background: var(--cd); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .95rem; }
.ex-a { margin-top: 14px; display: flex; gap: 8px; align-items: flex-start; background: var(--ok-soft); border: 2px solid #9bd6b8; border-radius: 14px; padding: 10px 14px; color: #0f4d33; font-weight: 600; }
.ex-a .ic { color: var(--ok); margin-top: 6px; }

/* الشكل */
.figure { display: grid; place-items: center; margin: 12px 0; padding: 10px; background: #fff; border: 2px dashed #efd6df; border-radius: 16px; }
.fig-svg { width: 100%; max-width: 440px; height: auto; direction: ltr; display: block; overflow: visible; }
.fig-svg .ln { stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.fig-svg .ln.thin { stroke-width: 1.8; }
.fig-svg .ln2 { stroke: var(--pink); stroke-width: 2.6; fill: none; stroke-linecap: round; }
.fig-svg .tri { fill: rgba(236, 108, 156, .08); stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
.fig-svg .arc { fill: none; stroke: var(--pink); stroke-width: 2; }
.fig-svg .tk { stroke: var(--pink); stroke-width: 2.2; stroke-linecap: round; }
.fig-svg .pt { fill: var(--ink); }
.fig-svg .grid { stroke: #ecdbe2; stroke-width: 1; }
.fig-svg .axis { stroke: #8a6b7d; stroke-width: 1.8; }
.fig-svg .vl { fill: var(--ink); font: italic 500 17px var(--f-math); }
.fig-svg .vl.big { font-size: 21px; font-weight: 700; }
.fig-svg .vl.m { font-style: normal; font-size: 16px; }
.fig-svg .an { fill: var(--plum); font: 700 14px var(--f-body); pointer-events: none; }
.fig-svg .an.hl { fill: #fff; }
.fig-svg .vn { fill: var(--plum); font: 700 22px var(--f-math); text-anchor: middle; }
.fig-svg .venn-box { fill: #fffaf0; stroke: #d7b46a; stroke-width: 2; }
.fig-svg .venn-c { fill: none; stroke-width: 3; }
.fig-svg .vp { stroke: #d12f6b; } .fig-svg .vq { stroke: #e0a223; }
.fig-svg .cc { fill: none; stroke: var(--pink); stroke-width: 2; stroke-dasharray: 4 3; }
.fig-svg .wedge { fill: rgba(236, 108, 156, .12); stroke: rgba(209, 47, 107, .45); stroke-width: 1.4; }
.fig-svg .wedge.static { pointer-events: none; }
.fig-svg .wedge.hl, .fig-svg .hl.wedge { fill: rgba(209, 47, 107, .55); }
.fig-svg .hot { cursor: pointer; }
.fig-svg .hot .hit { stroke: transparent; stroke-width: 20; fill: none; pointer-events: stroke; }
.fig-svg .hot .wedge { transition: fill .15s; }
.fig-svg .hot.hl .wedge { fill: rgba(209, 47, 107, .5); }
.fig-svg .hot.hl .an { fill: #fff; }
.fig-svg .hot:hover .wedge { fill: rgba(209, 47, 107, .3); }
.fig-svg .hot:hover .vis { stroke: var(--pink-2); }
.fig-svg .hot.sel .wedge { fill: rgba(47, 107, 255, .3); stroke: #2f6bff; stroke-width: 3; stroke-dasharray: 6 3; }
.fig-svg .hot.sel .vis { stroke: #2f6bff; stroke-width: 5; }
.fig-svg .hot.ok .wedge { fill: rgba(23, 115, 76, .35); stroke: var(--ok); stroke-width: 3; stroke-dasharray: none; }
.fig-svg .hot.ok .vis { stroke: var(--ok); stroke-width: 6; }
.fig-svg .hot.no .wedge { fill: rgba(179, 38, 30, .22); stroke: var(--no); stroke-width: 3; stroke-dasharray: 2 4; }
.fig-svg .hot.no .vis { stroke: var(--no); stroke-width: 5; stroke-dasharray: 3 6; }
.fig-svg .hot:focus-visible { outline: none; }
.fig-svg .hot:focus-visible .wedge, .fig-svg .hot:focus-visible .vis { stroke: #2f6bff; stroke-width: 5; }
.fig-hot { border-style: solid; }
.hintline { color: var(--ink-2); font-size: .95rem; margin-bottom: 6px; }

/* التحدي */
.quiz-head { display: grid; gap: 10px; justify-items: start; }
.qdots { list-style: none; display: flex; gap: 10px; margin: 0; padding: 0; }
.qdots .dot { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2.5px solid var(--line); font-weight: 700; color: var(--ink-2); }
.qdots .dot svg { width: 20px; height: 20px; }
.qdots li.cur .dot { border-color: var(--cd); color: var(--cd); box-shadow: 0 0 0 4px var(--cs); }
.qdots li.good .dot { background: var(--gold-soft); border-color: #efc24a; color: #d49000; }
.qdots li.miss .dot { background: var(--info-soft); border-color: #b9a5e8; color: #5f43a3; }
.q-meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .92rem; color: var(--ink-2); margin-bottom: 6px; }
.qtype { background: var(--cs); color: var(--cd); padding: 1px 12px; border-radius: 999px; font-weight: 600; }
.q-prompt { font-family: var(--f-body); font-weight: 600; font-size: clamp(1.25rem, 3.2vw, 1.5rem); line-height: 1.7; color: var(--ink); }
.q-body { margin-top: 12px; }
.q-actions { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.q-side { display: flex; justify-content: center; }
.opts { display: grid; gap: 10px; }
.opt { position: relative; display: grid; grid-template-columns: 38px 1fr 28px; gap: 12px; align-items: center; text-align: start; min-height: 58px; padding: 10px 14px; border-radius: 16px; background: #fff; border: 2.5px solid var(--line); transition: border-color .15s, background .15s, transform .1s; }
.opt:hover:not(:disabled) { border-color: var(--c1); background: var(--cs); }
.ol { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--cs); color: var(--cd); font-weight: 700; font-family: var(--f-display); }
.opt.sel { border-color: #2f6bff; background: #edf2ff; box-shadow: 0 0 0 3px rgba(47, 107, 255, .18); }
.opt.sel .ol { background: #2f6bff; color: #fff; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); border-width: 3px; }
.opt.ok .ol { background: var(--ok); color: #fff; }
.opt.no { border-color: var(--no); background: var(--no-soft); border-style: dashed; border-width: 3px; }
.opt.no .ol { background: var(--no); color: #fff; }
.opt:disabled { cursor: default; }
.oi { width: 26px; height: 26px; display: inline-grid; place-items: center; }
.oi svg { width: 100%; height: 100%; }
.ok > .oi, .ok .oi { color: var(--ok); } .no > .oi, .no .oi { color: var(--no); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.mi { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; padding: 8px 14px; border-radius: 14px; background: #fff; border: 2.5px solid var(--line); text-align: start; }
.mi:hover:not(:disabled) { border-color: var(--c1); background: var(--cs); }
.mi.sel { border-color: #2f6bff; background: #edf2ff; box-shadow: 0 0 0 3px rgba(47, 107, 255, .2); }
.mi.paired { border-color: var(--cd); background: var(--cs); }
.mi .pn { flex: none; min-width: 26px; height: 26px; border-radius: 50%; background: var(--cd); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: .85rem; }
.mi.ok { border-color: var(--ok); background: var(--ok-soft); border-width: 3px; } .mi.no { border-color: var(--no); background: var(--no-soft); border-style: dashed; border-width: 3px; }
@media (max-width: 520px) { .match { gap: 10px; } .mi { padding: 8px 10px; font-size: .95rem; } }
.targets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tgt { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 16px; border-radius: 999px; background: #fff; border: 2.5px solid var(--line); font-family: var(--f-math); }
.tgt:hover:not(:disabled) { background: var(--cs); border-color: var(--c1); }
.tgt.sel { border-color: #2f6bff; background: #edf2ff; }
.tgt.ok { border-color: var(--ok); background: var(--ok-soft); } .tgt.no { border-color: var(--no); background: var(--no-soft); border-style: dashed; }
.tgt .oi { width: 20px; height: 20px; }
.ord { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.oi-row { display: grid; grid-template-columns: 34px 1fr 26px auto; gap: 10px; align-items: center; background: #fff; border: 2.5px solid var(--line); border-radius: 14px; padding: 8px 10px; cursor: grab; }
.oi-row.drag { opacity: .5; }
.oi-row.ok { border-color: var(--ok); background: var(--ok-soft); } .oi-row.no { border-color: var(--no); background: var(--no-soft); border-style: dashed; }
.oi-row .pos { width: 30px; height: 30px; border-radius: 50%; background: var(--cd); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.mv { display: inline-flex; gap: 4px; }
.mvb { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--line); background: #fff; color: var(--cd); display: grid; place-items: center; padding: 0; }
.mvb svg { width: 22px; height: 22px; }
.mvb:disabled { opacity: .3; cursor: default; }
.mvb:hover:not(:disabled) { background: var(--cs); }
.q-fb { display: none; margin-top: 14px; padding: 14px 16px; border-radius: 16px; position: relative; }
.q-fb.show { display: block; animation: pop .3s ease-out; }
.q-fb.good { background: var(--ok-soft); border: 2px solid #8fd1b0; }
.q-fb.bad { background: #fff4e3; border: 2px solid #f2c46b; }
.q-fb.reveal { background: var(--info-soft); border: 2px solid #bba8ea; }
.fb-t { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 1.1rem; }
.fb-i { width: 30px; height: 30px; padding: 5px; border-radius: 50%; background: #fff; }
.good .fb-i { color: var(--ok); } .bad .fb-i { color: #b46b00; } .reveal .fb-i { color: #5f43a3; }
.got-star, .no-star { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: .92rem; padding: 2px 12px; border-radius: 999px; background: #fff; }
.got-star { color: #8a5d00; border: 2px solid #efc24a; } .no-star { color: var(--ink-2); border: 2px solid var(--line); }
.fb-x { margin-top: 8px; }
.tip-l { font-weight: 700; color: #8a5d00; }
.burst { position: absolute; inset-inline-end: 70px; top: 12px; width: 0; height: 0; pointer-events: none; }
.burst .b { position: absolute; width: 18px; height: 18px; margin: -9px; color: #f0a81c; animation: fly .9s ease-out forwards; }
.burst .b svg { width: 100%; height: 100%; }
@keyframes fly { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(80deg); opacity: 0; } }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* النتائج */
.result-card, .achieve-card, .final-card { text-align: center; display: grid; gap: 14px; justify-items: center; }
.big-stars { display: flex; gap: 10px; }
.bs { width: clamp(64px, 16vw, 92px); height: clamp(64px, 16vw, 92px); display: block; animation: starIn .6s both; animation-delay: var(--d); }
.bs.on { color: #f0a81c; filter: drop-shadow(0 6px 8px rgba(240, 168, 28, .35)); } .bs.off { color: #cdb9a4; }
.bs svg { width: 100%; height: 100%; }
@keyframes starIn { from { transform: scale(.2) rotate(-40deg); opacity: 0; } 60% { transform: scale(1.18) rotate(8deg); opacity: 1; } to { transform: none; } }
.score b { font-family: var(--f-math); font-size: 1.1em; }
.msg { max-width: 46ch; color: var(--ink-2); }
.medal { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff6d0, #f6cb5c 70%); color: #8e6307; border: 4px solid #fff; box-shadow: 0 10px 24px rgba(224, 162, 35, .4); animation: starIn .7s both; }
.medal .ic { width: 52px; height: 52px; } .medal.big { width: 120px; height: 120px; } .medal.big .ic { width: 70px; height: 70px; }
.stage-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; width: 100%; max-width: 520px; }
.stage-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; text-align: start; }
.stars { display: inline-flex; gap: 2px; } .stars .st { width: 22px; height: 22px; display: block; } .stars .st.on { color: #f0a81c; } .stars .st.off { color: #c5b2a0; } .stars svg { width: 100%; height: 100%; display: block; }
.final-stats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.final-stats div { background: #fff; border: 2px solid #efd9a2; border-radius: 18px; padding: 10px 26px; display: grid; }
.final-stats b { font-family: var(--f-math); font-size: 2rem; color: var(--plum); line-height: 1.2; } .final-stats span { color: var(--ink-2); }
.review h2 { font-size: 1.5rem; margin-bottom: 10px; text-align: center; }
.review-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (max-width: 640px) { .review-grid { grid-template-columns: 1fr; } }
.rv-world { background: var(--card); border: 2px solid var(--c1); border-radius: 18px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.rv-world h3 { color: var(--cd); font-size: 1.15rem; }
.rv-stage { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: start; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 48px; }
.rv-stage:hover { background: var(--cs); border-color: var(--c1); }
.rv-stage .rt { font-size: .95rem; }

/* نافذة */
.modal-back { position: fixed; inset: 0; z-index: 300; background: rgba(58, 18, 48, .5); display: grid; place-items: center; padding: 16px; overflow: auto; }
.modal { background: #fffdfb; border-radius: 24px; padding: 22px; max-width: 560px; width: 100%; border: 2px solid #f1dbe3; box-shadow: 0 24px 60px rgba(58, 18, 48, .35); animation: pop .25s ease-out; }
.modal h2 { font-size: 1.5rem; margin-bottom: 10px; }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.howto { margin: 0; padding-inline-start: 22px; display: grid; gap: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.dl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; padding: 12px 16px; border: 2px dashed var(--c1); border-radius: 18px; background: #fff; }
.dl-t { font-weight: 800; color: var(--cd); }
.dl a.btn { text-decoration: none; min-height: 48px; }

.dl-msg { flex-basis: 100%; text-align: center; font-weight: 700; color: var(--cd); min-height: 1.2em; }

/* الأيقونة على اليسار (نهاية السطر في الواجهة العربية) */
.btn, .icon-btn, .pill, .counter, .rule-t, .got-star, .no-star, .tgt { flex-direction: row-reverse; }
.btn:has(.ic.flip), .btn:has(.ic.flip) { flex-direction: row; }

/* كل أيقونات الأزرار في أقصى اليسار */
.btn, .icon-btn, .pill, .counter, .rule-t, .got-star, .no-star, .tgt { flex-direction: row; }
.btn .ic, .icon-btn .ic, .pill .ic, .counter .ic, .rule-t .ic, .got-star .ic, .no-star .ic, .tgt .ic { order: 99; }

.recap { text-align: start; margin: 14px 0 6px; padding: 12px 16px; border: 2px solid var(--cs); border-radius: 18px; background: #fff; }
.recap h2 { font-size: 1.15rem; color: var(--cd); margin-bottom: 4px; }
.recap ul { margin: 0; padding-inline-start: 20px; } .recap li { margin: 3px 0; }
.result .dl { margin-top: 12px; }
.btn-xl { min-height: 58px; }
.actions:not(.center), .q-actions { flex-direction: row-reverse; justify-content: flex-start; width: 100%; }
.dl { width: 100%; box-sizing: border-box; }
.dl-msg:empty { display: none; }
/* عكس اتجاه الأسهم */
.ic.flip svg { transform: none; }
.icon-btn[data-act="map"] .ic svg { transform: scaleX(-1); }

<script>
/* مكتبة الرسومات الهندسية (SVG). كل دالة تعيد نصّ SVG جاهزًا، والإحداثيات بوحدات viewBox. */
(function () {
  var D2R = Math.PI / 180;
  function f(n) { return Math.round(n * 100) / 100; }
  function svg(w, h, body, label) {
    return '<svg class="fig-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + label + '" xmlns="http://www.w3.org/2000/svg">' + body + '</svg>';
  }
  /* نقطة على دائرة: زاوية رياضية (عكس عقارب الساعة، المحور y للأعلى) */
  function pp(cx, cy, r, a) { return [f(cx + r * Math.cos(a * D2R)), f(cy - r * Math.sin(a * D2R))]; }
  function ln(x1, y1, x2, y2, c) { return '<line class="' + (c || 'ln') + '" x1="' + f(x1) + '" y1="' + f(y1) + '" x2="' + f(x2) + '" y2="' + f(y2) + '"/>'; }
  function tx(x, y, s, c, anchor) { return '<text class="' + (c || 'vl') + '" x="' + f(x) + '" y="' + f(y) + '" text-anchor="' + (anchor || 'middle') + '">' + s + '</text>'; }
  function dot(x, y, r) { return '<circle class="pt" cx="' + f(x) + '" cy="' + f(y) + '" r="' + (r || 3.6) + '"/>'; }
  function poly(pts, c) { return '<polygon class="' + (c || 'tri') + '" points="' + pts.map(function (p) { return f(p[0]) + ',' + f(p[1]); }).join(' ') + '"/>'; }
  function arc(cx, cy, r, a1, a2, c) {
    var s = pp(cx, cy, r, a1), e = pp(cx, cy, r, a2), large = Math.abs(a2 - a1) > 180 ? 1 : 0;
    return '<path class="' + (c || 'arc') + '" d="M' + s[0] + ' ' + s[1] + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + e[0] + ' ' + e[1] + '"/>';
  }
  function wedge(cx, cy, r, a1, a2) {
    var s = pp(cx, cy, r, a1), e = pp(cx, cy, r, a2), large = Math.abs(a2 - a1) > 180 ? 1 : 0;
    return 'M' + cx + ' ' + cy + ' L' + s[0] + ' ' + s[1] + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + e[0] + ' ' + e[1] + ' Z';
  }
  /* علامة زاوية قائمة عند الرأس (vx,vy) بين اتجاهين (زاويتان رياضيتان) */
  function right(vx, vy, a1, a2, s) {
    s = s || 12; var p1 = pp(vx, vy, s, a1), p2 = pp(vx, vy, s, a2), p3 = [f(p1[0] + p2[0] - vx), f(p1[1] + p2[1] - vy)];
    return '<polyline class="arc" points="' + p1.join(',') + ' ' + p3.join(',') + ' ' + p2.join(',') + '"/>';
  }
  /* علامات تطابق على قطعة */
  function tick(x1, y1, x2, y2, n) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux, out = '';
    for (var i = 0; i < n; i++) {
      var o = (i - (n - 1) / 2) * 6;
      out += ln(mx + ux * o - nx * 6, my + uy * o - ny * 6, mx + ux * o + nx * 6, my + uy * o + ny * 6, 'tk');
    }
    return out;
  }
  /* قوس تطابق زوايا (عدد الأقواس n) داخل زاوية رأسها v من اتجاه a1 إلى a2 */
  function amark(vx, vy, a1, a2, r, n) {
    var o = ''; for (var i = 0; i < n; i++) o += arc(vx, vy, r + i * 5, a1, a2, 'arc'); return o;
  }
  function mang(f0, t) { var a = Math.atan2(-(t[1] - f0[1]), t[0] - f0[0]) / D2R; return a < 0 ? a + 360 : a; }
  function chev(x, y) { return '<path class="ln thin" d="M' + (x - 7) + ' ' + (y - 6) + ' L' + x + ' ' + y + ' L' + (x - 7) + ' ' + (y + 6) + '"/>'; }
  function lbl(x, y, s) { return tx(x, y, s, 'vl'); }
  function vert(x, y, s, a) { return tx(x, y, s, 'vl', a); }
  /* قطعة قابلة للنقر: خط ظاهر + خط شفاف عريض */
  function hotLine(id, label, x1, y1, x2, y2) {
    return '<g class="hot" data-hot="' + id + '" data-label="' + label + '"><line class="vis ln" x1="' + f(x1) + '" y1="' + f(y1) + '" x2="' + f(x2) + '" y2="' + f(y2) + '"/><line class="hit" x1="' + f(x1) + '" y1="' + f(y1) + '" x2="' + f(x2) + '" y2="' + f(y2) + '"/></g>';
  }
  function hotPath(id, label, d, inner) {
    return '<g class="hot" data-hot="' + id + '" data-label="' + label + '"><path class="wedge" d="' + d + '"/>' + (inner || '') + '</g>';
  }

  var FG = {};

  /* ---- الفصل ١ ---- */
  /* دائرتان p (يمين) و q (يسار) مع مناطق قابلة للنقر. */
  FG.venn = function (hot, nums) {
    var cp = [215, 100], cq = [125, 100], r = 70, d = 90, ix = 170, iy = f(Math.sqrt(r * r - 45 * 45));
    var top = [ix, f(100 - iy)], bot = [ix, f(100 + iy)];
    var pOnly = 'M' + top[0] + ' ' + top[1] + ' A70 70 0 1 1 ' + bot[0] + ' ' + bot[1] + ' A70 70 0 0 0 ' + top[0] + ' ' + top[1] + ' Z';
    var qOnly = 'M' + top[0] + ' ' + top[1] + ' A70 70 0 1 0 ' + bot[0] + ' ' + bot[1] + ' A70 70 0 0 1 ' + top[0] + ' ' + top[1] + ' Z';
    var both = 'M' + top[0] + ' ' + top[1] + ' A70 70 0 0 1 ' + bot[0] + ' ' + bot[1] + ' A70 70 0 0 1 ' + top[0] + ' ' + top[1] + ' Z';
    var none = 'M4 4 H336 V196 H4 Z M' + top[0] + ' ' + top[1] + ' A70 70 0 1 1 ' + bot[0] + ' ' + bot[1] + ' A70 70 0 0 1 ' + top[0] + ' ' + top[1] + ' Z M' + top[0] + ' ' + top[1] + ' A70 70 0 1 0 ' + bot[0] + ' ' + bot[1] + ' A70 70 0 0 0 ' + top[0] + ' ' + top[1] + ' Z';
    var n = nums || {};
    var body = '<rect class="venn-box" x="4" y="4" width="332" height="192" rx="10"/>';
    if (hot) {
      body += hotPath('none', 'خارج الدائرتين', none, '') + hotPath('ponly', 'p فقط', pOnly) + hotPath('qonly', 'q فقط', qOnly) + hotPath('both', 'p و q معًا', both);
    }
    body += '<circle class="venn-c vp" cx="215" cy="100" r="70"/><circle class="venn-c vq" cx="125" cy="100" r="70"/>' +
      tx(250, 36, 'p', 'vl big') + tx(90, 36, 'q', 'vl big');
    if (n.ponly !== undefined) body += tx(250, 106, n.ponly, 'vn') + tx(90, 106, n.qonly, 'vn') + tx(170, 106, n.both, 'vn') + tx(26, 30, n.none, 'vn');
    return svg(340, 200, body, 'مخطط فن لعبارتين p و q');
  };
  FG.line4 = function () {
    var b = ln(20, 60, 320, 60) + [60, 140, 220, 290].map(function (x) { return dot(x, 60); }).join('') +
      [['W', 60], ['X', 140], ['Y', 220], ['Z', 290]].map(function (p) { return tx(p[1], 90, p[0], 'vl big'); }).join('');
    return svg(340, 110, b, 'أربع نقاط W و X و Y و Z على مستقيم واحد بهذا الترتيب');
  };
  FG.angLine = function (left, right) {
    var ox = 170, oy = 130, ra = pp(ox, oy, 100, 80);
    var b = ln(20, oy, 320, oy) + ln(ox, oy, ra[0], ra[1]) + dot(ox, oy) +
      arc(ox, oy, 34, 80, 180) + arc(ox, oy, 34, 0, 80) +
      tx(ox - 62, oy - 24, '∠1', 'vl') + tx(ox + 58, oy - 20, '∠2', 'vl') +
      tx(ox - 72, oy + 24, left, 'vl m') + tx(ox + 70, oy + 24, right, 'vl m');
    return svg(340, 170, b, 'مستقيم يخرج منه شعاع فيكوّن الزاويتين 1 و 2 المتجاورتين على مستقيم');
  };

  /* ---- القاطع والمستقيمان (الفصل ٢) ---- */
  FG.transv = function (o) {
    o = o || {};
    var th = o.theta || 65, names = o.names || ['ℓ', 'm'], dy = 80, y1 = 70, y2 = 150;
    var dx = dy / Math.tan(th * D2R), x2 = 150, x1 = f(x2 + dx);
    var ext = 52, ex = ext / Math.tan(th * D2R);
    var body = ln(24, y1, 320, y1) + ln(24, y2, 320, y2) + ln(x2 - ex, y2 + ext, x1 + ex, y1 - ext) + chev(300, y1) + chev(300, y2);
    if (o.perp) { /* قاطع عمودي */ }
    body += tx(14, y1 - 8, names[0], 'vl big') + tx(14, y2 - 8, names[1], 'vl big');
    var R = 36, sets = [[x1, y1, ['1', '2', '3', '4']], [x2, y2, ['5', '6', '7', '8']]], hl = o.hl || {};
    sets.forEach(function (s) {
      var angs = [[th, 180, s[2][0]], [0, th, s[2][1]], [180, 180 + th, s[2][2]], [180 + th, 360, s[2][3]]];
      angs.forEach(function (a) {
        var mid = (a[0] + a[1]) / 2, lp = pp(s[0], s[1], R * 0.64, mid), id = a[2];
        var t = tx(lp[0], lp[1] + 5, id, 'an' + (hl[id] ? ' hl' : ''));
        body += o.hot ? hotPath(id, '∠' + id, wedge(s[0], s[1], R, a[0], a[1]), t).replace('class="hot"', hl[id] ? 'class="hot hl"' : 'class="hot"') : '<path class="wedge static' + (hl[id] ? ' hl' : '') + '" d="' + wedge(s[0], s[1], R, a[0], a[1]) + '"/>' + t;
        if (o.given && o.given[id]) { var gp = pp(s[0], s[1], R + 22, mid); body += tx(gp[0], gp[1] + 5, o.given[id], 'vl m'); }
      });
    });

  /* ---------- أنواع الأسئلة ---------- */
  function makeInteraction(q, el) {
    return ({ mcq: mcq, match: match, point: point, order: order })[q.type](q, el);
  }

  function mcq(q, el) {
    var opts = q.options.map(function (t, i) { return { t: t, c: i === q.answer }; });
    if (!q.fixed) opts = shuffle(opts);
    var sel = -1, locked = false;
    el.innerHTML = '<div class="opts" role="radiogroup" aria-label="الخيارات">' + opts.map(function (o, i) {
      return '<button type="button" class="opt" role="radio" aria-checked="false" data-i="' + i + '"><span class="ol">' + LETTERS[i] + '</span><span class="ot">' + o.t + '</span><span class="oi" aria-hidden="true"></span><span class="vh ostate"></span></button>';
    }).join('') + '</div>';
    var btns = el.querySelectorAll('.opt');
    el.addEventListener('click', function (e) {
      var b = e.target.closest('.opt'); if (!b || locked) return;
      sel = +b.dataset.i; sfx('tap');
      btns.forEach(function (x, i) { x.classList.toggle('sel', i === sel); x.setAttribute('aria-checked', i === sel ? 'true' : 'false'); });
      refreshCheck();
    });
    function setState(i, cls, icon, txt) { var b = btns[i]; b.classList.add(cls); b.querySelector('.oi').innerHTML = icon; b.querySelector('.ostate').textContent = txt; }
    return {
      ready: function () { return sel >= 0; },
      check: function () { return opts[sel].c; },
      mark: function (ok) { if (ok) setState(sel, 'ok', IC.check, ' — إجابة صحيحة'); else { setState(sel, 'no', IC.x, ' — إجابة غير صحيحة'); } },
      reveal: function () { btns.forEach(function (b) { b.classList.remove('no'); b.querySelector('.oi').innerHTML = ''; b.querySelector('.ostate').textContent = ''; }); opts.forEach(function (o, i) { if (o.c) setState(i, 'ok', IC.check, ' — الإجابة الصحيحة'); }); },
      lock: function () { locked = true; btns.forEach(function (b) { b.disabled = true; }); },
      retry: function () { btns.forEach(function (b, i) { b.classList.remove('no', 'sel'); b.setAttribute('aria-checked', 'false'); b.querySelector('.oi').innerHTML = ''; b.querySelector('.ostate').textContent = ''; }); sel = -1; }
    };
  }

  function match(q, el) {
    var L = q.pairs.map(function (p, i) { return { t: p[0], i: i }; });
    var Rr = shuffle(q.pairs.map(function (p, i) { return { t: p[1], i: i }; }), true);
    var pairs = {}; // يسار -> يمين (فهرس في Rr)
    var selL = -1, locked = false, shown = false;
    el.innerHTML = '<p class="hintline">اختاري عنصرًا من العمود الأول ثم ما يقابله من العمود الثاني. اضغطي على عنصر موصول لفكّه.</p><div class="match"><div class="col colL" role="list"></div><div class="col colR" role="list"></div></div>';
    var cl = el.querySelector('.colL'), cr = el.querySelector('.colR');
    function pairNo(li) { var ks = Object.keys(pairs).map(Number).sort(function (a, b) { return a - b; }); return ks.indexOf(li) + 1; }
    function draw() {
      var used = {}; Object.keys(pairs).forEach(function (k) { used[pairs[k]] = +k; });
      cl.innerHTML = L.map(function (o, i) {
        var p = pairs[i] !== undefined;
        return '<button type="button" role="listitem" class="mi ' + (selL === i ? 'sel ' : '') + (p ? 'paired ' : '') + (o.cls || '') + '" data-s="L" data-i="' + i + '"><span class="mt">' + o.t + '</span>' + (p ? '<span class="pn">' + (i + 1) + '</span>' : '') + '<span class="oi" aria-hidden="true">' + (o.icon || '') + '</span></button>';
      }).join('');
      cr.innerHTML = Rr.map(function (o, j) {
        var li = used[j], p = li !== undefined;
        return '<button type="button" role="listitem" class="mi ' + (p ? 'paired ' : '') + (o.cls || '') + '" data-s="R" data-j="' + j + '"><span class="mt">' + o.t + '</span>' + (p ? '<span class="pn">' + (li + 1) + '</span>' : '') + '<span class="oi" aria-hidden="true">' + (o.icon || '') + '</span></button>';
      }).join('');
    }
    draw();
    el.addEventListener('click', function (e) {
      var b = e.target.closest('.mi'); if (!b || locked) return;
      sfx('tap');
      if (b.dataset.s === 'L') {
        var i = +b.dataset.i;
        if (pairs[i] !== undefined) { delete pairs[i]; selL = -1; L.forEach(function (o) { o.cls = ''; o.icon = ''; }); Rr.forEach(function (o) { o.cls = ''; o.icon = ''; }); }
        else selL = (selL === i ? -1 : i);
      } else {
        var j = +b.dataset.j, owner = null;
        Object.keys(pairs).forEach(function (k) { if (pairs[k] === j) owner = +k; });
        if (owner !== null) { delete pairs[owner]; L.forEach(function (o) { o.cls = ''; o.icon = ''; }); Rr.forEach(function (o) { o.cls = ''; o.icon = ''; }); }
        else if (selL >= 0) { pairs[selL] = j; selL = -1; }
      }
      draw(); refreshCheck();
    });
    function eachPair(fn) { Object.keys(pairs).forEach(function (k) { fn(+k, pairs[k]); }); }
    return {
      ready: function () { return Object.keys(pairs).length === L.length; },
      check: function () { var ok = true; eachPair(function (l, j) { if (Rr[j].i !== L[l].i) ok = false; }); return ok; },
      mark: function (ok) {
        eachPair(function (l, j) { var good = Rr[j].i === L[l].i; L[l].cls = good ? 'ok' : 'no'; L[l].icon = good ? IC.check : IC.x; Rr[j].cls = good ? 'ok' : 'no'; Rr[j].icon = good ? IC.check : IC.x; });
        draw();
      },
      reveal: function () {
        pairs = {}; Rr.forEach(function (o, j) { pairs[o.i] = j; });
        L.forEach(function (o) { o.cls = 'ok'; o.icon = IC.check; }); Rr.forEach(function (o) { o.cls = 'ok'; o.icon = IC.check; }); draw();
      },
      lock: function () { locked = true; el.querySelectorAll('.mi').forEach(function (b) { b.disabled = true; }); },
      retry: function () { L.forEach(function (o) { o.cls = ''; o.icon = ''; }); Rr.forEach(function (o) { o.cls = ''; o.icon = ''; }); pairs = {}; selL = -1; draw(); }
    };
  }

  function point(q, el) {
    var sel = null, locked = false;
    el.innerHTML = '<p class="hintline">اضغطي على الجزء المطلوب في الرسم' + (q.targets ? ' أو اختاريه من القائمة تحت الرسم' : '') + '.</p><div class="figure fig-hot">' + q.svg + '</div>' +
      (q.targets ? '<div class="targets" role="radiogroup" aria-label="عناصر الرسم">' + q.targets.map(function (t) { return '<button type="button" class="tgt" role="radio" aria-checked="false" data-id="' + t.id + '">' + t.label + '<span class="oi" aria-hidden="true"></span></button>'; }).join('') + '</div>' : '');
    var hots = el.querySelectorAll('[data-hot]');
    hots.forEach(function (n) { n.setAttribute('tabindex', '0'); n.setAttribute('role', 'button'); n.setAttribute('aria-label', n.getAttribute('data-label') || n.getAttribute('data-hot')); });
    function choose(id) {
      if (locked) return; sel = id; sfx('tap');
      hots.forEach(function (n) { n.classList.toggle('sel', n.getAttribute('data-hot') === id); });
      el.querySelectorAll('.tgt').forEach(function (t) { t.classList.toggle('sel', t.dataset.id === id); t.setAttribute('aria-checked', t.dataset.id === id ? 'true' : 'false'); });
      refreshCheck();
    }
    el.addEventListener('click', function (e) {
      var n = e.target.closest('[data-hot]'); if (n) { choose(n.getAttribute('data-hot')); return; }
      var t = e.target.closest('.tgt'); if (t) choose(t.dataset.id);
    });
    el.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-hot]')) { e.preventDefault(); choose(e.target.getAttribute('data-hot')); }
    });
    function paint(id, cls, icon) {
      hots.forEach(function (n) { if (n.getAttribute('data-hot') === id) n.classList.add(cls); });
      el.querySelectorAll('.tgt').forEach(function (t) { if (t.dataset.id === id) { t.classList.add(cls); t.querySelector('.oi').innerHTML = icon; } });
    }
    function clear() { hots.forEach(function (n) { n.classList.remove('ok', 'no', 'sel'); }); el.querySelectorAll('.tgt').forEach(function (t) { t.classList.remove('ok', 'no', 'sel'); t.querySelector('.oi').innerHTML = ''; t.setAttribute('aria-checked', 'false'); }); }
    return {
      ready: function () { return sel !== null; },
      check: function () { return sel === q.answer; },
      mark: function (ok) { paint(sel, ok ? 'ok' : 'no', ok ? IC.check : IC.x); },
      reveal: function () { clear(); paint(q.answer, 'ok', IC.check); },
      lock: function () { locked = true; el.querySelectorAll('.tgt').forEach(function (t) { t.disabled = true; }); },
      retry: function () { clear(); sel = null; }
    };
  }

  function order(q, el) {
    var items = shuffle(q.steps.map(function (s, i) { return { t: s, i: i }; }), true);
    var locked = false, marks = null, dragI = -1;
    function draw() {
      el.innerHTML = '<p class="hintline">رتّبي الخطوات من الأولى إلى الأخيرة: اسحبي البطاقة أو استعملي السهمين.</p><ol class="ord">' + items.map(function (o, p) {
        var m = marks ? (marks[p] ? 'ok' : 'no') : '';
        return '<li class="oi-row ' + m + '" draggable="' + (!locked) + '" data-p="' + p + '"><span class="pos">' + (p + 1) + '</span><span class="otxt">' + o.t + '</span>' +
          '<span class="oi" aria-hidden="true">' + (m === 'ok' ? IC.check : m === 'no' ? IC.x : '') + '</span>' +
          '<span class="mv"><button type="button" class="mvb" data-mv="-1" data-p="' + p + '" aria-label="تحريك للأعلى" ' + (locked || p === 0 ? 'disabled' : '') + '>' + IC.up + '</button><button type="button" class="mvb" data-mv="1" data-p="' + p + '" aria-label="تحريك للأسفل" ' + (locked || p === items.length - 1 ? 'disabled' : '') + '>' + IC.down + '</button></span></li>';
      }).join('') + '</ol>';
    }
    draw();
    function move(a, b) { if (b < 0 || b >= items.length || a === b) return; var t = items.splice(a, 1)[0]; items.splice(b, 0, t); marks = null; draw(); }
    el.addEventListener('click', function (e) {
      var b = e.target.closest('.mvb'); if (!b || locked) return;
      sfx('tap'); var p = +b.dataset.p; move(p, p + (+b.dataset.mv));
      var nb = el.querySelector('.mvb[data-p="' + (p + (+b.dataset.mv)) + '"][data-mv="' + b.dataset.mv + '"]') || el.querySelector('.mvb[data-p="' + (p + (+b.dataset.mv)) + '"]'); if (nb) nb.focus();
    });
    el.addEventListener('dragstart', function (e) { var r = e.target.closest('.oi-row'); if (!r || locked) return; dragI = +r.dataset.p; r.classList.add('drag'); try { e.dataTransfer.setData('text/plain', String(dragI)); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} });
    el.addEventListener('dragover', function (e) { if (dragI >= 0) e.preventDefault(); });
    el.addEventListener('drop', function (e) { var r = e.target.closest('.oi-row'); if (!r || dragI < 0) return; e.preventDefault(); var to = +r.dataset.p, from = dragI; dragI = -1; move(from, to); });
    el.addEventListener('dragend', function () { dragI = -1; var r = el.querySelector('.drag'); if (r) r.classList.remove('drag'); });
    return {
      ready: function () { return true; },
      check: function () { return items.every(function (o, p) { return o.i === p; }); },
      mark: function () { marks = items.map(function (o, p) { return o.i === p; }); draw(); },
      reveal: function () { items = items.slice().sort(function (a, b) { return a.i - b.i; }); marks = items.map(function () { return true; }); locked = true; draw(); },
      lock: function () { locked = true; draw(); },
      retry: function () { marks = null; draw(); }
    };
  }

  /* ---------- نوافذ المساعدة ---------- */
  function showHowTo() {
    openModal('كيف ألعب؟',
      '<ol class="howto"><li>اختاري مرحلة مفتوحة من الخريطة. تُفتح المرحلة التالية بعد إنهاء السابقة.</li>' +
      '<li>اقرئي بطاقة الملخص ثم المثال المحلول، ثم اضغطي «ابدئي التحدي».</li>' +
      '<li>في كل تحدٍّ ثلاثة أسئلة. تنالين نجمة عن كل سؤال تجيبين عنه صحيحًا من المحاولة الأولى.</li>' +
      '<li>عند الخطأ يظهر تلميح وتُعطين فرصة ثانية. بعد الخطأ الثاني يظهر الحل مع الشرح.</li>' +
      '<li>زر «راجعي القاعدة» يعرض الملخص دون أن تخسري تقدمك. يمكنك إعادة أي مرحلة لتحسين نجومك، وتبقى أفضل نتيجة.</li>' +
      '<li>العدّاد الأول يحسب المراحل من ١٦، والثاني يحسب النجوم من ٤٨. يُحفظ تقدمك على هذا الجهاز تلقائيًا.</li></ol>');
  }
  function showRule() {
    var st = STAGES[R ? R.idx : (view.idx || 0)];
    openModal('راجعي القاعدة: ' + st.title,
      '<ul class="points">' + st.summary.points.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>' + (st.summary.rule ? '<div class="rule"><span class="rule-t">' + ic('book') + 'القاعدة</span><div>' + st.summary.rule + '</div></div>' : ''),
      [{ label: 'العودة إلى السؤال', cls: 'btn-primary' }]);
  }
  function confirmReset() {
    openModal('البدء من جديد', '<p>سيُمسح كل تقدمك ونجومك المحفوظة على هذا الجهاز، وتعود المرحلة الأولى وحدها مفتوحة. لا يمكن التراجع عن ذلك.</p>',
      [{ label: 'نعم، امسحي التقدم', cls: 'btn-danger', fn: function () { var m = S.muted; S = defState(); S.muted = m; save(); R = null; screenMap(); } }, { label: 'إلغاء', cls: 'btn-ghost' }]);
  }

  /* ---------- التوجيه عبر الأحداث ---------- */
  function goStage(idx, el) {
    var st = STAGES[idx];
    if (!unlocked(st)) {
      openModal('المرحلة مقفلة', '<p>أنهي المرحلة «' + STAGES[idx - 1].title + '» أولًا لتُفتح هذه المرحلة.</p>');
      return;
    }
    gate(el, function () { screenIntro(idx, 0, false); });
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, i = +b.dataset.i;
    if (a !== 'check' && a !== 'next-q') sfx('tap');
    switch (a) {
      case 'begin': gate(b, screenMap); break;
      case 'map': closeModal(); screenMap(); break;
      case 'howto': showHowTo(); break;
      case 'dl': doDownload(b); break;
      case 'print': doPrint(b); break;
      case 'sound': S.muted = !S.muted; save(); sfx('tap'); rerenderBar(); break;
      case 'reset': confirmReset(); break;
      case 'stage': case 'continue': goStage(i, b); break;
      case 'intro-next': screenIntro(view.idx, 1, view.review); break;
      case 'intro-back': screenIntro(view.idx, 0, view.review); break;
      case 'start-challenge': gate(b, function () { startRun(i); }); break;
      case 'rule': showRule(); break;
      case 'check': doCheck(b); break;
      case 'retry':
        R.cur.retry(); document.getElementById('qfb').className = 'q-fb'; document.getElementById('qfb').innerHTML = ''; renderQActions(); break;
      case 'next-q':
        if (R.qi < QN - 1) { R.qi++; screenQuestion(); } else finishRun(); break;
      case 'replay': gate(b, function () { startRun(i); }); break;
      case 'after-result': {
        var st = STAGES[i];
        if (doneCount() === TOTAL_STAGES && !S.seenFinal) screenFinal(); else screenWorld(st.wi);
        break; }
      case 'final': screenFinal(); break;
      case 'review': screenIntro(i, 0, true); break;
    }
  });
  function rerenderBar() {
    var tb = root.querySelector('.topbar'); if (!tb) return;
    var hasBack = !!tb.querySelector('[data-act="map"]');
    tb.outerHTML = topbar({ back: hasBack });
  }

  /* ---------- البداية ---------- */
  screenStart();

  /* واجهة اختبار */
  window.__game = { S: function () { return S; }, STAGES: STAGES, show: { map: screenMap, world: screenWorld, result: screenResult }, doneCount: doneCount, starCount: starCount };
})();

</script>
</body>
</html>
